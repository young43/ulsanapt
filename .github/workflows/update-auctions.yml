name: 울산 아파트 경매정보 자동 업데이트

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 확인
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집기 의존성 설치
        run: python -m pip install -r requirements.txt

      - name: 법원·온비드 데이터 수집
        run: python collect.py

      - name: 정적 사이트 생성
        run: python build_site.py

      - name: 변경된 데이터와 페이지 커밋
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auctions.json docs/index.html docs/artifact.html site/index.html site/artifact.html
          if git diff --cached --quiet; then
            echo "변경사항 없음"
            exit 0
          fi
          git commit -m "Automated auction data update"
          git push
